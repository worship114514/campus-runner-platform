<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分类管理 · 校园闪电侠后台</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/theme.css">
    <style>
        .admin-layout {
            display: flex;
            min-height: 100vh;
        }
        .admin-sidebar {
            width: 220px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            padding: var(--space-4) 0;
            flex-shrink: 0;
        }
        .admin-sidebar .logo {
            padding: 0 var(--space-4) var(--space-4);
            font-weight: 700;
            font-size: var(--font-size-lg);
            color: var(--primary-500);
            border-bottom: 1px solid var(--border-color);
            margin-bottom: var(--space-4);
        }
        .admin-sidebar .menu-item {
            padding: var(--space-3) var(--space-4);
            cursor: pointer;
            font-size: var(--font-size-sm);
            color: var(--text-secondary);
            transition: all 0.2s;
            border-left: 3px solid transparent;
            display: block;
        }
        .admin-sidebar .menu-item:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }
        .admin-sidebar .menu-item.active {
            border-left-color: var(--primary-500);
            background: var(--bg-hover);
            color: var(--primary-500);
            font-weight: 500;
        }
        .admin-main {
            flex: 1;
            padding: var(--space-4) var(--space-6);
            background: var(--bg-primary);
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: var(--space-4);
            border-bottom: 1px solid var(--border-color);
            margin-bottom: var(--space-6);
        }
        .admin-header .title {
            font-size: var(--font-size-xl);
            font-weight: 600;
        }
        .admin-header .user {
            font-size: var(--font-size-sm);
            color: var(--text-secondary);
        }
        .admin-header .user button {
            margin-left: var(--space-2);
        }
        .edit-box {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            padding: var(--space-5);
            margin-bottom: var(--space-6);
        }
        .edit-row {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            margin-bottom: var(--space-3);
            flex-wrap: wrap;
        }
        .edit-row .label {
            font-weight: 500;
            font-size: var(--font-size-sm);
            min-width: 80px;
            color: var(--text-secondary);
        }
        .edit-row .field-input {
            flex: 1;
            min-width: 150px;
        }
        .edit-row .color-picker-wrapper {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-md);
            border: 2px solid var(--border-color);
            cursor: pointer;
            flex-shrink: 0;
        }
        .edit-row .color-picker-wrapper:hover {
            border-color: var(--primary-500);
        }
        .btn-submit-wrapper {
            display: flex;
            gap: var(--space-3);
            margin-top: var(--space-3);
        }
        .btn-clear {
            background: var(--bg-secondary);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }
        .btn-clear:hover {
            background: var(--bg-hover);
        }
        .table-wrap {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: var(--font-size-sm);
        }
        table th, table td {
            padding: var(--space-3) var(--space-4);
            border-bottom: 1px solid var(--border-color);
            text-align: left;
        }
        table th {
            background: var(--bg-hover);
            font-weight: 600;
            color: var(--text-secondary);
        }
        table tr:hover {
            background: var(--bg-hover);
        }
        .tag-demo {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 4px;
            font-size: 12px;
            border: 1px solid;
        }
        .action-link {
            color: var(--primary-500);
            cursor: pointer;
            margin-right: var(--space-3);
        }
        .action-link:hover {
            text-decoration: underline;
        }
        .action-link.delete {
            color: var(--error-500);
        }
        .color-picker-popup {
            position: fixed;
            z-index: 1000;
        }
        .color-picker-popup input[type="color"] {
            width: 150px;
            height: 40px;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="admin-layout">
    <!-- 侧边栏 -->
    <div class="admin-sidebar">
        <div class="logo">🏃 闪电侠</div>
        <a href="index.html" class="menu-item">📊 仪表盘</a>
        <a href="tasks.html" class="menu-item">📋 任务管理</a>
        <a href="users.html" class="menu-item">👤 用户管理</a>
        <a href="runners.html" class="menu-item">🏍️ 跑腿员审核</a>
        <a href="category.html" class="menu-item active">🏷️ 分类管理</a>
    </div>

    <!-- 主内容 -->
    <div class="admin-main">
        <div class="admin-header">
            <div class="title">🏷️ 分类管理</div>
            <div class="user">
                <span id="adminName">管理员</span>
                <button class="btn btn-outline btn-sm" id="logoutBtn">退出</button>
            </div>
        </div>

        <!-- 编辑区 -->
        <div class="edit-box">
            <div class="edit-row">
                <span class="label">分类名称</span>
                <input type="text" id="catName" class="form-input field-input" placeholder="输入分类名称" maxlength="6">
                <input type="hidden" id="catId">
                <input type="hidden" id="oldName">
            </div>
            <div class="edit-row">
                <span class="label">标签颜色</span>
                <div class="color-picker-wrapper" id="colorPicker" style="background-color:#FF6B35;"></div>
                <input type="color" id="colorInput" value="#FF6B35" style="width:60px;height:40px;border:none;cursor:pointer;">
                <span id="colorValue" style="font-size:var(--font-size-sm);color:var(--text-muted);">#FF6B35</span>
            </div>
            <div class="edit-row btn-submit-wrapper">
                <button class="btn btn-secondary" id="clearBtn">清空</button>
                <button class="btn btn-primary" id="saveBtn">新增/更新</button>
            </div>
        </div>

        <!-- 列表区 -->
        <div class="card">
            <div class="card-header">📋 分类列表</div>
            <div class="card-body">
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>分类名称</th>
                                <th>显示效果</th>
                                <th>标签颜色</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="categoryTableBody">
                            <tr><td colspan="4" style="text-align:center;padding:var(--space-8);">加载中...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="../libs/axios.min.js"></script>
<script src="../js/app.js"></script>

<script>
    var admin = {
        id: app.getCookie('aid'),
        token: app.getCookie('atoken'),
        name: app.getCookie('adminName')
    };

    if (!admin.id || !admin.token) {
        window.location.href = 'login.html';
    }

    document.getElementById('adminName').textContent = admin.name || '管理员';

    // 退出
    document.getElementById('logoutBtn').addEventListener('click', function() {
        app.deleteCookie('aid');
        app.deleteCookie('atoken');
        app.deleteCookie('adminName');
        window.location.href = 'login.html';
    });

    // ========== 颜色选择 ==========
    var colorPicker = document.getElementById('colorPicker');
    var colorInput = document.getElementById('colorInput');
    var colorValue = document.getElementById('colorValue');

    colorInput.addEventListener('input', function() {
        var val = this.value;
        colorPicker.style.backgroundColor = val;
        colorValue.textContent = val;
    });

    colorPicker.addEventListener('click', function() {
        colorInput.click();
    });

    // ========== 加载分类列表 ==========
    function loadCategories() {
        var tbody = document.getElementById('categoryTableBody');

        axios.get(app.adminServerUrl + '/category/list')
            .then(function(res) {
                if (res.data && res.data.status === 200) {
                    var list = res.data.data || [];
                    renderCategories(list);
                } else {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:var(--space-8);">加载失败</td></tr>';
                }
            })
            .catch(function(err) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:var(--space-8);">加载失败，请刷新重试</td></tr>';
            });
    }

    function renderCategories(list) {
        var tbody = document.getElementById('categoryTableBody');
        if (!list || list.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:var(--space-8);">暂无分类</td></tr>';
            return;
        }

        var html = '';
        list.forEach(function(cat) {
            html += `
                <tr>
                    <td>${cat.name}</td>
                    <td><span class="tag-demo" style="color:${cat.tagColor};border-color:${cat.tagColor};">${cat.name}</span></td>
                    <td>${cat.tagColor}</td>
                    <td>
                        <span class="action-link" onclick="editCategory(${cat.id})">编辑</span>
                        <span class="action-link delete" onclick="deleteCategory(${cat.id})">删除</span>
                    </td>
                </tr>
            `;
        });
        tbody.innerHTML = html;
    }

    // ========== 编辑分类 ==========
    window.editCategory = function(id) {
        var list = document.querySelectorAll('#categoryTableBody tr');
        // 从当前列表中查找
        var tbody = document.getElementById('categoryTableBody');
        var rows = tbody.querySelectorAll('tr');
        for (var i = 0; i < rows.length; i++) {
            var cells = rows[i].querySelectorAll('td');
            if (cells.length < 4) continue;
            // 通过显示的数据匹配
            var name = cells[0].textContent.trim();
            var color = cells[2].textContent.trim();

            // 通过id查找（从按钮传参已获取id）
            document.getElementById('catId').value = id;
            document.getElementById('catName').value = name;
            document.getElementById('oldName').value = name;
            colorPicker.style.backgroundColor = color;
            colorInput.value = color;
            colorValue.textContent = color;
            document.getElementById('saveBtn').textContent = '更新分类';
            break;
        }
    };

    // ========== 删除分类 ==========
    window.deleteCategory = function(id) {
        if (!confirm('确认删除该分类？')) return;

        axios.delete(app.adminServerUrl + '/category/delete', {
            params: { id: id }
        }).then(function(res) {
            if (res.data && res.data.status === 200) {
                app.showToast('删除成功');
                loadCategories();
            } else {
                app.showToast(res.data.msg || '删除失败');
            }
        }).catch(function(err) {
            app.showToast('删除失败');
        });
    };

    // ========== 保存分类 ==========
    document.getElementById('saveBtn').addEventListener('click', function() {
        var id = document.getElementById('catId').value;
        var name = document.getElementById('catName').value.trim();
        var oldName = document.getElementById('oldName').value;
        var tagColor = colorInput.value;

        if (!name) {
            app.showToast('请输入分类名称');
            return;
        }
        if (name.length > 6) {
            app.showToast('分类名称不能超过6个字符');
            return;
        }

        var data = {
            id: id || null,
            name: name,
            oldName: oldName || null,
            tagColor: tagColor
        };

        this.disabled = true;
        this.textContent = '保存中...';

        axios.post(app.adminServerUrl + '/category/save', data)
            .then(function(res) {
                if (res.data && res.data.status === 200) {
                    app.showToast('保存成功');
                    document.getElementById('catId').value = '';
                    document.getElementById('catName').value = '';
                    document.getElementById('oldName').value = '';
                    document.getElementById('saveBtn').textContent = '新增/更新';
                    loadCategories();
                } else {
                    app.showToast(res.data.msg || '保存失败');
                }
            })
            .catch(function(err) {
                app.showToast(err.response ? err.response.data.msg : '保存失败');
            })
            .finally(function() {
                document.getElementById('saveBtn').disabled = false;
                document.getElementById('saveBtn').textContent = '新增/更新';
            });
    });

    // ========== 清空表单 ==========
    document.getElementById('clearBtn').addEventListener('click', function() {
        document.getElementById('catId').value = '';
        document.getElementById('catName').value = '';
        document.getElementById('oldName').value = '';
        var defaultColor = '#FF6B35';
        colorPicker.style.backgroundColor = defaultColor;
        colorInput.value = defaultColor;
        colorValue.textContent = defaultColor;
        document.getElementById('saveBtn').textContent = '新增/更新';
    });

    // ========== 初始化 ==========
    loadCategories();
</script>

</body>
</html>
