<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台登录 · 校园闪电侠</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/theme.css">
    <style>
        .admin-login {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            padding: var(--space-4);
        }
        .admin-login .card {
            width: 100%;
            max-width: 400px;
            background: white;
            border-radius: var(--radius-2xl);
            padding: var(--space-8) var(--space-6);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
        }
        .admin-login .logo {
            text-align: center;
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--primary-500);
            margin-bottom: var(--space-2);
        }
        .admin-login .subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: var(--font-size-sm);
            margin-bottom: var(--space-6);
        }
        .admin-login .error-msg {
            background: #fee2e2;
            color: #991b1b;
            padding: var(--space-2) var(--space-3);
            border-radius: var(--radius-md);
            margin-bottom: var(--space-4);
            font-size: var(--font-size-sm);
            display: none;
        }
        .admin-login .switch-link {
            text-align: center;
            margin-top: var(--space-4);
            font-size: var(--font-size-sm);
            color: var(--text-muted);
        }
        .admin-login .switch-link a {
            color: var(--primary-500);
            font-weight: 500;
        }
        .admin-login .switch-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="admin-login">
        <div class="card">
            <div class="logo">🏃 校园闪电侠</div>
            <div class="subtitle">管理后台</div>

            <div id="errorMsg" class="error-msg"></div>

            <div class="form-group">
                <label class="form-label">管理员账号</label>
                <input type="text" id="username" class="form-input" placeholder="请输入管理员账号" value="admin">
            </div>
            <div class="form-group">
                <label class="form-label">密码</label>
                <input type="password" id="password" class="form-input" placeholder="请输入密码" value="123456">
            </div>

            <button class="btn btn-primary btn-block" id="loginBtn">登录</button>

            <div class="switch-link">
                <a href="../portal/index.html">返回首页</a>
            </div>
            <div class="switch-link" style="margin-top:var(--space-2);">
                <a href="../portal/help.html">遇到问题？帮助中心</a>
            </div>
        </div>
    </div>

    <script src="../libs/axios.min.js"></script>
    <script src="../js/app.js"></script>

    <script>
        function showError(msg) {
            var el = document.getElementById('errorMsg');
            el.textContent = msg;
            el.style.display = 'block';
            setTimeout(function() {
                el.style.display = 'none';
            }, 3000);
        }

        document.getElementById('loginBtn').addEventListener('click', function() {
            var username = document.getElementById('username').value.trim();
            var password = document.getElementById('password').value.trim();

            if (!username || !password) {
                showError('请输入账号和密码');
                return;
            }

            this.disabled = true;
            this.textContent = '登录中...';

            axios.post(app.adminServerUrl + '/admin/login', null, {
                params: { username: username, password: password }
            }).then(function(res) {
                if (res.data && res.data.status === 200) {
                    var data = res.data.data;
                    var admin = data.admin || data;
                    var token = data.token || admin.token || admin.id;

                    app.setCookie('aid', admin.id, 30);
                    app.setCookie('atoken', token, 30);
                    app.setCookie('adminName', admin.adminName || admin.username, 30);

                    app.showToast('登录成功');
                    setTimeout(function() {
                        window.location.href = 'index.html';
                    }, 500);
                } else {
                    showError(res.data.msg || '登录失败');
                }
            }).catch(function(err) {
                if (err.response && err.response.data) {
                    showError(err.response.data.msg || '登录失败');
                } else {
                    showError('登录失败，请重试');
                }
            }).finally(function() {
                document.getElementById('loginBtn').disabled = false;
                document.getElementById('loginBtn').textContent = '登录';
            });
        });

        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('loginBtn').click();
            }
        });
    </script>

</body>
</html>
