<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 · 校园闪电侠</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/theme.css">
    <style>
        .register-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            padding: var(--space-4);
        }
        .register-card {
            width: 100%;
            max-width: 460px;
            background: white;
            border-radius: var(--radius-2xl);
            padding: var(--space-8) var(--space-6);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
        }
        .register-card .logo {
            text-align: center;
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--primary-500);
            margin-bottom: var(--space-2);
        }
        .register-card .subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: var(--font-size-sm);
            margin-bottom: var(--space-6);
        }
        .register-card .switch-link {
            text-align: center;
            margin-top: var(--space-4);
            font-size: var(--font-size-sm);
            color: var(--text-muted);
        }
        .register-card .switch-link a {
            color: var(--primary-500);
            font-weight: 500;
        }
        .register-card .switch-link a:hover {
            text-decoration: underline;
        }
        .error-msg {
            background: #fee2e2;
            color: #991b1b;
            padding: var(--space-2) var(--space-3);
            border-radius: var(--radius-md);
            margin-bottom: var(--space-4);
            font-size: var(--font-size-sm);
            display: none;
        }
        .info-box {
            background: var(--neutral-50);
            border-radius: var(--radius-md);
            padding: var(--space-3);
            font-size: var(--font-size-sm);
            color: var(--text-secondary);
            margin-bottom: var(--space-4);
        }
        .row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-3);
        }
        .form-error {
            font-size: var(--font-size-sm);
            color: var(--error-500);
            margin-top: var(--space-1);
            display: none;
        }
        @media (max-width: 480px) {
            .row-2 {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="register-page">
        <div class="register-card">
            <div class="logo">🏃 校园闪电侠</div>
            <div class="subtitle">注册成为校园跑腿平台用户</div>

            <div id="errorMsg" class="error-msg"></div>

            <div class="form-group">
                <label class="form-label">手机号 <span style="color:var(--error-500);">*</span></label>
                <input type="tel" id="mobile" class="form-input" placeholder="请输入手机号" maxlength="11">
                <div id="mobileError" class="form-error"></div>
            </div>

            <div class="form-group">
                <label class="form-label">昵称 <span style="color:var(--error-500);">*</span></label>
                <input type="text" id="nickname" class="form-input" placeholder="请输入昵称" maxlength="12">
                <div id="nicknameError" class="form-error"></div>
            </div>

            <div class="row-2">
                <div class="form-group">
                    <label class="form-label">密码 <span style="color:var(--error-500);">*</span></label>
                    <input type="password" id="password" class="form-input" placeholder="至少6位">
                    <div id="passwordError" class="form-error"></div>
                </div>
                <div class="form-group">
                    <label class="form-label">确认密码 <span style="color:var(--error-500);">*</span></label>
                    <input type="password" id="confirmPwd" class="form-input" placeholder="再次输入">
                    <div id="confirmError" class="form-error"></div>
                </div>
            </div>

            <button class="btn btn-primary btn-block" id="registerBtn">注册</button>

            <div class="switch-link">
                已有账号？<a href="login.html">立即登录</a>
            </div>
        </div>
    </div>

    <script src="../libs/axios.min.js"></script>
    <script src="../js/app.js"></script>

    <script>
        // ========== 显示错误 ==========
        function showError(msg) {
            var el = document.getElementById('errorMsg');
            el.textContent = msg;
            el.style.display = 'block';
            setTimeout(function() {
                el.style.display = 'none';
            }, 3000);
        }

        // ========== 失焦验证 ==========
        document.getElementById('mobile').addEventListener('blur', function() {
            var val = this.value.trim();
            var errorEl = document.getElementById('mobileError');
            if (!val) {
                errorEl.textContent = '请输入手机号';
                errorEl.style.display = 'block';
            } else if (!/^1[3-9]\d{9}$/.test(val)) {
                errorEl.textContent = '请输入正确的手机号';
                errorEl.style.display = 'block';
            } else {
                errorEl.style.display = 'none';
            }
        });

        document.getElementById('nickname').addEventListener('blur', function() {
            var val = this.value.trim();
            var errorEl = document.getElementById('nicknameError');
            if (!val) {
                errorEl.textContent = '请输入昵称';
                errorEl.style.display = 'block';
            } else if (val.length > 12) {
                errorEl.textContent = '昵称不能超过12位';
                errorEl.style.display = 'block';
            } else {
                errorEl.style.display = 'none';
            }
        });

        document.getElementById('password').addEventListener('blur', function() {
            var val = this.value;
            var errorEl = document.getElementById('passwordError');
            if (!val) {
                errorEl.textContent = '请输入密码';
                errorEl.style.display = 'block';
            } else if (val.length < 6) {
                errorEl.textContent = '密码长度至少6位';
                errorEl.style.display = 'block';
            } else {
                errorEl.style.display = 'none';
            }
        });

        document.getElementById('confirmPwd').addEventListener('blur', function() {
            var pwd = document.getElementById('password').value;
            var val = this.value;
            var errorEl = document.getElementById('confirmError');
            if (!val) {
                errorEl.textContent = '请再次输入密码';
                errorEl.style.display = 'block';
            } else if (val !== pwd) {
                errorEl.textContent = '两次密码不一致';
                errorEl.style.display = 'block';
            } else {
                errorEl.style.display = 'none';
            }
        });

        // ========== 提交注册 ==========
        document.getElementById('registerBtn').addEventListener('click', function() {
            var mobile = document.getElementById('mobile').value.trim();
            var nickname = document.getElementById('nickname').value.trim();
            var password = document.getElementById('password').value.trim();
            var confirmPwd = document.getElementById('confirmPwd').value.trim();

            if (!mobile) { showError('请输入手机号'); return; }
            if (!/^1[3-9]\d{9}$/.test(mobile)) { showError('请输入正确的手机号'); return; }
            if (!nickname) { showError('请输入昵称'); return; }
            if (nickname.length > 12) { showError('昵称不能超过12位'); return; }
            if (!password || password.length < 6) { showError('密码长度至少6位'); return; }
            if (password !== confirmPwd) { showError('两次输入的密码不一致'); return; }

            var requestData = {
                mobile: mobile,
                nickname: nickname,
                password: password
            };

            this.disabled = true;
            this.textContent = '注册中...';

            axios.post(app.userServerUrl + '/passport/register', requestData)
                .then(function(res) {
                    if (res.data && res.data.status === 200) {
                        app.showToast('注册成功！请登录');
                        setTimeout(function() {
                            window.location.href = 'login.html';
                        }, 1000);
                    } else {
                        showError(res.data.msg || '注册失败');
                    }
                })
                .catch(function(err) {
                    if (err.response && err.response.data && err.response.data.msg) {
                        showError(err.response.data.msg);
                    } else {
                        showError('注册失败，请重试');
                    }
                })
                .finally(function() {
                    document.getElementById('registerBtn').disabled = false;
                    document.getElementById('registerBtn').textContent = '注册';
                });
        });
    </script>

</body>
</html>
